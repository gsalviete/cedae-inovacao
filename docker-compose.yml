version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cedae_inovacao_app
    restart: unless-stopped
    ports:
      - "8095:8095"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ORACLE_HOST=${ORACLE_HOST}
      - ORACLE_PORT=${ORACLE_PORT:-1521}
      - ORACLE_SERVICE=${ORACLE_SERVICE}
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - PORT=8095
      - PROJECT_PATH=${PROJECT_PATH:-}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL:-60}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      # Só necessário em dev/Docker sem IIS. Em produção o IIS injeta x-remote-user.
      - DEV_REMOTE_USER=${DEV_REMOTE_USER:-}

      # ── E-mail (SMTP) — confirmação automática da Via 2 ───────────────────
      # A ausência destas era o motivo de o e-mail não sair rodando em Docker.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_TLS_REJECT_UNAUTHORIZED=${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-bi.7@cedae.com.br}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-CEDAE Inovação}

      # ── Termos e Condições de Uso ─────────────────────────────────────────
      # Incrementar faz o aceite ser solicitado novamente.
      - TERMOS_VERSAO=${TERMOS_VERSAO:-2.0}
    volumes:
      - ./.env:/app/.env
      - ./frontend:/frontend
    networks:
      - cedae_net

networks:
  cedae_net:
    driver: bridge
