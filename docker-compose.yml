version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cedae_inovacao_app
    restart: unless-stopped
    ports:
      - "8095:8095"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      # Quando preenchida, vence o trio HOST/PORT/SERVICE. Aceita Easy Connect,
      # descritor TNS inline "(DESCRIPTION=…)" ou alias do tnsnames.ora — neste
      # último caso monte o arquivo e aponte ORACLE_TNS_ADMIN para a pasta.
      - ORACLE_CONNECT_STRING=${ORACLE_CONNECT_STRING:-}
      - ORACLE_TNS_ADMIN=${ORACLE_TNS_ADMIN:-}
      - ORACLE_HOST=${ORACLE_HOST:-}
      - ORACLE_PORT=${ORACLE_PORT:-1521}
      - ORACLE_SERVICE=${ORACLE_SERVICE:-}
      - PORT=8095
      - PROJECT_PATH=${PROJECT_PATH:-}
      - RATE_LIMIT_TTL=${RATE_LIMIT_TTL:-60}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      # Só necessário em dev/Docker sem IIS. Em produção o IIS injeta x-remote-user.
      - DEV_REMOTE_USER=${DEV_REMOTE_USER:-}

      # ── E-mail (SMTP) — confirmação automática da Via 2 ───────────────────
      # O prefixo INOVACAO_ é obrigatório e não tem fallback: nos servidores os
      # nomes MAIL_*/SMTP_* pertencem ao cron de deploy da infra, e o app
      # herdava esses valores em silêncio. Ver .env.example.
      - INOVACAO_MAIL_ENABLED=${INOVACAO_MAIL_ENABLED:-false}
      - INOVACAO_SMTP_HOST=${INOVACAO_SMTP_HOST:-}
      - INOVACAO_SMTP_PORT=${INOVACAO_SMTP_PORT:-25}
      - INOVACAO_SMTP_SECURE=${INOVACAO_SMTP_SECURE:-false}
      - INOVACAO_SMTP_TLS_REJECT_UNAUTHORIZED=${INOVACAO_SMTP_TLS_REJECT_UNAUTHORIZED:-false}
      - INOVACAO_SMTP_USER=${INOVACAO_SMTP_USER:-}
      - INOVACAO_SMTP_PASS=${INOVACAO_SMTP_PASS:-}
      - INOVACAO_MAIL_FROM=${INOVACAO_MAIL_FROM:-bi.7@cedae.com.br}
      - INOVACAO_MAIL_FROM_NAME=${INOVACAO_MAIL_FROM_NAME:-CEDAE Inovação}

      # ── Termos e Condições de Uso ─────────────────────────────────────────
      # Incrementar faz o aceite ser solicitado novamente.
      - TERMOS_VERSAO=${TERMOS_VERSAO:-2.0}
    volumes:
      - ./.env:/app/.env
      - ./frontend:/frontend
      # Só quando ORACLE_CONNECT_STRING for um alias: monte a pasta com o
      # tnsnames.ora e use ORACLE_TNS_ADMIN=/app/tns.
      # - ./tns:/app/tns:ro
    networks:
      - cedae_net

networks:
  cedae_net:
    driver: bridge
