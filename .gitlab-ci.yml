stages:
  - build-app
  - docker
  - test

variables:
  GIT_SSL_NO_VERIFY: "true"

cache:
  - key: pnpm-cache
    paths:
      - backend/node_modules/

.rules:
  develop: &develop_rule
    if: '$CI_COMMIT_BRANCH == "develop"'

  main: &main_rule
    if: '$CI_COMMIT_BRANCH == "main"'

  prod_mr: &prod_mr_rule
    if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

workflow:
  rules:
    - *develop_rule
    - *main_rule
    - *prod_mr_rule
    - when: never

include:
  - project: 'devjava/ci-templates'
    ref: develop
    file:
      - '/build/build-node-pnpm.yml'
      - '/docker/docker-build-push.yml'
    rules:
      - *develop_rule

  - project: 'devjava/ci-templates'
    ref: develop
    file:
      - '/build/build-node-pnpm.yml'
      - '/docker/docker-build-push-prod.yml'
    rules:
      - *main_rule
      - *prod_mr_rule

deploy_dev:
  stage: test

  tags:
    - dev-server

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - echo "=================================="
    - echo "DEPLOY DEV"
    - echo "=================================="

    - cd /opt/containers/cedae-inovacao

    - echo "Atualizando código..."
    - git fetch origin
    - git checkout develop
    - git reset --hard origin/develop

    - echo "Build da aplicação..."
    - docker build -t cedae_inovacao_app:dev .

    - echo "Removendo container anterior..."
    - docker rm -f cedae_inovacao_app || true

    - echo "Subindo aplicação..."
    - docker run -d \
        --name cedae_inovacao_app \
        --restart unless-stopped \
        --env-file /opt/containers/cedae-inovacao/.env \
        -p 8095:8095 \
        cedae_inovacao_app:dev

    - echo "=================================="
    - echo "Container:"
    - docker ps --filter "name=cedae_inovacao_app"

    - echo "=================================="
    - echo "Health check:"
    - sleep 5
    - curl --fail http://localhost:8095/api/health

    - echo "=================================="
    - echo "DEPLOY CONCLUÍDO"
    - echo "=================================="