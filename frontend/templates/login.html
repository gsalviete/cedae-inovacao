<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — CEDAE Inovação</title>
  <script>window.__BASE_PATH__ = "{{BASE_PATH}}";</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2C16 2 6 13.5 6 21a10 10 0 0 0 20 0C26 13.5 16 2 16 2Z' fill='%230B4F8A'/%3E%3Cpath d='M12 20a4 4 0 0 0 4 4' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{BASE_PATH}}/static/css/style.css">
  <style>
    .login-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: linear-gradient(150deg, var(--blue-950) 0%, var(--blue-900) 45%, var(--blue-800) 100%);
    }
    /* Textura de água/grade — coerente com o hero da home. */
    .login-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 60% 50% at 12% 15%, rgba(79,160,212,.30) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 90% 90%, rgba(141,198,63,.14) 0%, transparent 55%);
      pointer-events: none;
    }
    .login-page::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 0%, transparent 80%);
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 0%, transparent 80%);
      pointer-events: none;
    }
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 40px 36px 32px;
      animation: pop-in var(--dur-slow) var(--ease-out) both;
    }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-brand img { width: 100%; max-width: 240px; height: auto; margin-bottom: 20px; }
    .login-brand h1 {
      font-family: var(--font-display);
      font-size: 21px; font-weight: 700; letter-spacing: -.02em;
      color: var(--blue-800); margin: 0;
    }
    .login-brand p { font-size: 13px; color: var(--gray-500); margin: 7px 0 0; line-height: 1.5; }
    .login-card .field-group { margin-bottom: 18px; }
    .login-error {
      display: none; margin: 4px 0 18px;
      background: var(--red-50); border: 1px solid #f6cccc; color: #a51f1f;
      border-radius: var(--radius-sm); padding: 11px 13px; font-size: 13px;
    }
    .login-error.show { display: block; animation: shake var(--dur-slower) var(--ease-in-out) both; }
    .btn-primary.btn-login-submit { width: 100%; justify-content: center; padding: 12px; }
    .login-hint {
      text-align: center; font-size: 11.5px; color: var(--gray-400);
      margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="{{BASE_PATH}}/static/img/logo-cedae-horizontal.png"
             alt="Inovação CEDAE — Conexões que Transformam" />
        <h1>Assessoria de Inovação</h1>
        <p>Entre com suas credenciais de rede (Active Directory).</p>
      </div>

      <div id="login-error" class="login-error"></div>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="username">Usuário</label>
          <input type="text" id="username" name="username" class="field-input" required
            autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
            placeholder="Ex.: joao.silva" />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Senha</label>
          <input type="password" id="password" name="password" class="field-input" required
            autocomplete="current-password" placeholder="Sua senha de rede" />
        </div>

        <button type="submit" class="btn-primary btn-login-submit" id="btn-login">
          <span id="btn-login-text">Entrar</span>
          <span id="btn-login-loader" class="hidden">Autenticando...</span>
        </button>
      </form>

      <p class="login-hint">CEDAE — Companhia Estadual de Águas e Esgotos do Rio de Janeiro</p>
    </div>
  </div>

  <script src="{{BASE_PATH}}/static/js/api.js"></script>
  <script src="{{BASE_PATH}}/static/js/login.js"></script>
</body>

</html>
