<section class="admin-section" id="sec-usuarios">
  <div class="section-toolbar">
    <p class="section-note">Clique em um usuário para ver os detalhes e gerenciar o acesso.</p>
    <button class="btn-action" id="btn-novo-admin" onclick="openCreateUser()"><i data-icon="plus-circle"></i> Novo Usuário</button>
  </div>
  <div class="table-wrapper">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Perfil</th>
          <th>Ativo</th>
          <th>Desde</th>
        </tr>
      </thead>
      <tbody id="tbody-usuarios">
        <tr><td colspan="4"><span class="skeleton skeleton-line">.</span></td></tr>
        <tr><td colspan="4"><span class="skeleton skeleton-line">.</span></td></tr>
        <tr><td colspan="4"><span class="skeleton skeleton-line">.</span></td></tr>
      </tbody>
    </table>
  </div>
</section>

<!-- Modal: Novo Usuário Administrativo -->
<div id="modal-create-user" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
  <div class="modal-box">
    <h3 class="modal-title">Novo Usuário</h3>
    <form id="form-create-user" onsubmit="submitCreateUser(event)">
      <div class="form-group ad-lov-wrapper">
        <label class="form-label">Usuário *</label>
        <input type="text" id="cu-ad-search" class="form-input" required autocomplete="off"
               placeholder="Digite o nome ou e-mail para buscar..." oninput="onAdSearchInput()" />
        <div id="cu-ad-dropdown" class="ad-lov-dropdown hidden"></div>
      </div>
      <div class="form-group hidden">
        <label class="form-label">Nome</label>
        <input type="text" id="cu-nome" class="form-input" readonly placeholder="Preenchido automaticamente" />
      </div>
      <div class="form-group hidden">
        <label class="form-label">Email</label>
        <input type="text" id="cu-email" class="form-input" readonly placeholder="Preenchido automaticamente" />
      </div>
      <div class="form-group hidden">
        <label class="form-label">Login</label>
        <input type="text" id="cu-login" class="form-input" readonly placeholder="Preenchido automaticamente" />
      </div>
      <div class="form-group">
        <label class="form-label">Perfil *</label>
        <select id="cu-role" class="form-input" required>
          <option value="CONTRIBUTOR">Colaborador — Visualização e workflow</option>
          <option value="ADM">Administrador — Acesso total (gerencia administradores)</option>
        </select>
      </div>
      <div id="cu-result" class="cu-result hidden"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeCreateUser()">Cancelar</button>
        <button type="submit" class="btn-primary" id="cu-submit" disabled>Adicionar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Visualizar Usuário -->
<div id="modal-view-user" class="modal-overlay hidden" onclick="closeViewUserOnOverlay(event)">
  <div class="modal-box">
    <h3 class="modal-title">Detalhes do usuário</h3>
    <dl class="detail-list">
      <div class="detail-row"><dt>Login</dt><dd id="vu-login">—</dd></div>
      <div class="detail-row"><dt>Nome</dt><dd id="vu-nome">—</dd></div>
      <div class="detail-row"><dt>Perfil</dt><dd id="vu-role">—</dd></div>
      <div class="detail-row"><dt>Status</dt><dd id="vu-ativo">—</dd></div>
      <div class="detail-row"><dt>Cadastrado em</dt><dd id="vu-desde">—</dd></div>
    </dl>
    <div id="vu-gestao" class="vu-gestao"></div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="closeViewUser()">Fechar</button>
    </div>
  </div>
</div>
